name: phishguard

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: phishguard-backend:dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    MODEL_DIR: /models
    RAW_MAIL_DIR: /data/rawmail
  volumes:
    - ./ml/artifacts:/models:ro
    - rawmail:/data/rawmail
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: ["sh", "/app/backend/start-api.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  web:
    build:
      context: ./frontend
    image: phishguard-web:dev
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 测试用模拟邮件服务器（IMAP 3143 / SMTP 3025），默认不启动：docker compose --profile test up -d greenmail
  greenmail:
    profiles: ["test"]
    image: greenmail/standalone:2.1.2
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=alice:alice-pass@corp.test -Dgreenmail.users.login=email -Dgreenmail.verbose=false"
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"

  # 训练与实验环境，默认不启动：docker compose --profile ml run --rm ml <命令>
  ml:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: ml/Dockerfile
    image: phishguard-ml:dev
    working_dir: /work
    volumes:
      - ./ml:/work/ml
    command: ["python", "-I", "ml/scripts/prepare_data.py"]

volumes:
  pgdata:
  redisdata:
  rawmail:
