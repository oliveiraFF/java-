[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-detector"
version = "0.1.0"
description = "PhishGuard 钓鱼邮件检测引擎：邮件解析、规则、模型与融合打分"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.5", "onnxruntime>=1.19", "numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["phishguard_detector*"]
